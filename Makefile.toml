[config]
skip_core_tasks = true

[tasks.default]
alias = "dev"

[tasks.setup]
description = "Verifica dependências locais do ecossistema Rust e SurrealDB"
script = '''
echo "==> Verificando dependências..."
which surreal || echo "Aviso: surreal CLI não encontrado no PATH global."
which dx || echo "Instalando Dioxus CLI..." && cargo install dioxus-cli --locked
'''

[tasks.db]
description = "Inicia o banco de dados SurrealDB localmente com RocksDB"
command = "surreal"
args = ["start", "--user", "root", "--pass", "root", "rocksdb://database.db"]

[tasks.migrate]
description = "Executa as migrações e seed no SurrealDB"
script = '''
echo "==> Aplicando migrações no SurrealDB..."
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/001_iam_init.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/002_create_clinics.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/003_agenda.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/004_finance.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/005_stock.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/006_patients_and_documents.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/seed.surql)" http://127.0.0.1:8000/sql > /dev/null
echo "==> Banco de dados migrado e populado com sucesso!"
'''

[tasks.backend]
description = "Inicia o backend Actix-Web"
command = "cargo"
args = ["run", "-p", "backend"]

[tasks.frontend]
description = "Inicia o frontend Dioxus"
cwd = "frontend"
command = "dx"
args = ["serve"]

[tasks.check]
description = "Verifica a compilação do workspace completo"
command = "cargo"
args = ["check", "--workspace"]

[tasks.dev]
description = "Inicia todo o ambiente de desenvolvimento (DB, Backend e Frontend)"
script = '''
echo "=========================================================="
echo "           🚀 INICIANDO TOOTH PLUS DEV STACK              "
echo "=========================================================="

# 1. Inicia o SurrealDB em background se não estiver rodando
if ! curl -s http://127.0.0.1:8000/health > /dev/null 2>&1; then
    echo "==> Iniciando SurrealDB (rocksdb://database.db)..."
    surreal start --user root --pass root rocksdb://database.db &
    sleep 2
fi

# 2. Executa migrações
echo "==> Executando migrações..."
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/006_patients_and_documents.surql)" http://127.0.0.1:8000/sql > /dev/null
curl -s -X POST -u root:root -H "Accept: application/json" -d "USE NS saas; USE DB \`tooth-smile\`; $(cat migrations/seed.surql)" http://127.0.0.1:8000/sql > /dev/null

# 3. Inicia o Backend em background se não estiver rodando na porta 4000
if ! curl -s http://127.0.0.1:4000/ > /dev/null 2>&1; then
    echo "==> Iniciando Backend Actix-Web na porta 4000..."
    cargo run -p backend &
    sleep 3
fi

# 4. Inicia o Frontend Dioxus
echo "==> Iniciando Frontend Dioxus na porta 8080..."
cd frontend && dx serve
'''
