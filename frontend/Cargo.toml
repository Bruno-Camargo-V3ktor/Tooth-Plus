[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
dioxus = { version = "0.7", features = ["desktop", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.53.1"
gloo-timers = {version = "0.4.0", features=["futures"]}
base64 = "0.23.1"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
