[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
actix-web = "4.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
surrealdb = "3.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
jsonwebtoken = "11.0.0"
dotenvy = "0.15.7"
chrono = "0.4.45"
