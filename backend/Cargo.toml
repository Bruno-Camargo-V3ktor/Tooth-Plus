[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
actix-web = "4.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
surrealdb = "3.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
dotenvy = "0.15.7"
chrono = "0.4.45"
rand = "0.10.2"
aes-gcm = "0.10"
sha2 = "0.11"
base64 = "0.23"
async-trait = "0.1.92"
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
uuid = {version = "1.24.0", features = ["v4"]}
reqwest = { version = "0.13.4", features = ["json"] }
actix-cors = "0.7.1"
